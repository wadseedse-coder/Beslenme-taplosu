<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haftalık beslenme planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#14302a;--mute:#52665f;--line:#d9e3dd;--acc:#0f766e;--accbg:#d8efe9;--warm:#f5e3b3;--warmink:#6b4a05;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172623;--ink:#e6f1ed;--mute:#9db3ac;--line:#2a3d38;--acc:#5fd0c0;--accbg:#1d4a43;--warm:#4a3a12;--warmink:#f0d891;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172623;--ink:#e6f1ed;--mute:#9db3ac;--line:#2a3d38;--acc:#5fd0c0;--accbg:#1d4a43;--warm:#4a3a12;--warmink:#f0d891;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1,h2,.time{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 18px;color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr
